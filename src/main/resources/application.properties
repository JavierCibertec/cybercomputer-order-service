spring.application.name=order-service
server.address=${ORDER_BIND_ADDRESS:127.0.0.1}
server.port=${ORDER_PORT:8091}

spring.datasource.url=jdbc:mysql://${ORDER_DB_HOST:127.0.0.1}:${ORDER_DB_PORT:3306}/${ORDER_DB_NAME:cybercomputer_order}?connectionTimeZone=UTC
spring.datasource.username=${ORDER_DB_USER}
spring.datasource.password=${ORDER_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.jackson.deserialization.accept-float-as-int=false

app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.issuer=cybercomputer

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.cloud.openfeign.client.config.inventory-service.connectTimeout=3000
spring.cloud.openfeign.client.config.inventory-service.readTimeout=8000
spring.cloud.openfeign.client.config.inventory-service.loggerLevel=none

spring.rabbitmq.host=${RABBIT_HOST:127.0.0.1}
spring.rabbitmq.port=${RABBIT_PORT:5672}
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}
spring.rabbitmq.connection-timeout=5s
app.rabbitmq.publicacion-habilitada=${RABBIT_PUBLICACION_HABILITADA:true}
